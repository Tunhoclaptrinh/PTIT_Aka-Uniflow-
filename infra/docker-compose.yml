version: '3.8'

services:
  # 1. MongoDB Service
  mongo:
    image: mongo:7.0
    container_name: uniflow_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: uniflow_admin
      MONGO_INITDB_ROOT_PASSWORD: uniflow_secret_2026
      MONGO_INITDB_DATABASE: uniflow_db
    volumes:
      - mongo_data:/data/db
      - ./mongo-init/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

  # 2. Redis Service
  redis:
    image: redis:7.2-alpine
    container_name: uniflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "uniflow_redis_secret"]
    volumes:
      - redis_data:/data

  # 3. Qdrant Vector Engine
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: uniflow_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # 4. Backend NestJS Service
  backend:
    build:
      context: ../
      dockerfile: apps/backend/Dockerfile
    container_name: uniflow_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://uniflow_admin:uniflow_secret_2026@mongo:27017/uniflow_db?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=uniflow_redis_secret
      - AI_ENGINE_URL=http://ai-engine:8000
    depends_on:
      - mongo
      - redis

  # 5. AI Engine Python FastAPI Service
  ai-engine:
    build:
      context: ../apps/ai-engine
      dockerfile: Dockerfile
    container_name: uniflow_ai_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - qdrant

  # 6. Frontend Web Dashboard
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: uniflow_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
  qdrant_data:
